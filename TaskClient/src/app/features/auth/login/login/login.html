<div class="login-container">
  <div class="auth-header">
    <h2 routerLink="/">TaskFlow</h2>
    <p>ברוכים השבים! היכנסו כדי להמשיך לזרום עם המשימות שלכם.</p>
  </div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">
    
    <h2>התחברות למערכת</h2>

    <div class="form-group">
      <label>אימייל</label>
      <input type="email" formControlName="email" placeholder="enter@email.com">
      @if(loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
      <span class="error">
        מייל לא תקין
      </span>
      }
    </div>

    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" formControlName="password" placeholder="******">
    </div>
    @if(errorMessage) {
    <p class="server-error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="loginForm.invalid">התחבר 
    @if (isLoading()) {
    
      <div class="spinner"></div>
      <!-- <p class="loader-overlay">טוען...</p> -->
   
  }</button>

    <div class="footer-links">
      <span>עוד לא רשומה? </span>
      <a routerLink="/register">צרי חשבון חדש</a>
    </div>
  </form>

</div>
