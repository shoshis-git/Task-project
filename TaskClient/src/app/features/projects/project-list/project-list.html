<div class="projects-container">
  <div class="header">
    <button routerLink="/teams" class="back-btn">← חזרה</button>
    <h1 class="modern-title">פרויקטים בצוות <span>#{{ teamId() }}</span></h1>
    <button class="add-project-btn" (click)="isModalOpen = true">+ פרויקט חדש</button>
  </div>

  <div class="projects-list">
    @for (project of filteredProjects(); track project.id) {
      <div class="project-item" [routerLink]="['/tasks', project.id]">
        <div class="info">
          <h4>{{ project.name }}</h4>
          <p>{{ project.description }}</p>
        </div>
        <span class="status-badge">צפה במשימות</span>
      </div>
    } @empty {
      <div class="empty-state">
        <p>אין פרויקטים בצוות זה עדיין.</p>
        <button class="add-project-btn" (click)="isModalOpen = true">צור את הפרויקט הראשון</button>
      </div>
    }
  </div>

  @if (isModalOpen) {
    <div class="modal-overlay" (click)="isModalOpen = false">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h3>יצירת פרויקט חדש</h3>
          <button class="close-btn" (click)="isModalOpen = false">×</button>
        </div>
        <div class="modal-body">
          <input [(ngModel)]="newProject.name" placeholder="שם הפרויקט" />
          <textarea [(ngModel)]="newProject.description" placeholder="תיאור הפרויקט..."></textarea>
          <button class="submit-btn" (click)="onCreateProject(); isModalOpen = false">צור פרויקט</button>
        </div>
      </div>
    </div>
  }
</div>
