<div class="modal-overlay" (click)="closeComments()">
  <div class="modal-content comments-popup" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h5>💬 תגובות ({{ comments().length }})</h5>
      <button class="close-popup-btn" (click)="closeComments()">×</button>
    </div>

    <div class="comments-list">
      @for (comment of comments(); track comment.id) {
      <div class="comment-item">
        <strong>{{ comment.author_name }}</strong>
        <p>{{ comment.body }}</p>
        <small>{{ comment.created_at | date:'short' }}</small>
      </div>
      } @empty {
      <p class="empty-comments">אין תגובות עדיין. היו הראשונים להגיב!</p>
      }
    </div>

    <div class="add-comment">
      <textarea [(ngModel)]="newCommentBody" placeholder="כתבי תגובה..." rows="2">
      </textarea>
      <button (click)="sendComment()" [disabled]="!newCommentBody().trim()">שלח תגובה</button>
    </div>

  </div>
</div>
