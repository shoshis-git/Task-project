<div class="teams-container">
  <header>
    <h1>הצוותים שלי</h1>
    <div class="create-team-box">
      <input [(ngModel)]="newTeamName" placeholder="שם הצוות החדש..." />
      <button (click)="onCreateTeam()">+ צור צוות</button>
    </div>
  </header>

  <div class="teams-grid">
    @for (team of teams(); track team.id) {
      <div class="team-card">
        <h3>{{ team.name }}</h3>
        <p>חברים בצוות: {{ team.members_count }}</p>
        <span class="date">נוצר ב: {{ team.created_at | date:'dd/MM/yyyy' }}</span>
        <button class="view-btn">צפה בפרויקטים</button>
      </div>
    } @empty {
      <p class="empty-msg">עדיין אין לך צוותים. צרי את הצוות הראשון שלך!</p>
    }
  </div>
</div>
